services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leds
      POSTGRES_PASSWORD: leds
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leds -d postgres"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
