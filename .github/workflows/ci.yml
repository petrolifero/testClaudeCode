name: CI

on:
  # Restrito a main de proposito: com "branches: [**]" uma branch em PR
  # disparava push E pull_request, rodando a suite duas vezes por commit e
  # gastando o dobro de runner.
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A aplicacao chama o binario do tesseract para ler PDF que e imagem;
      # sem isto os testes de OCR falham. O runner do GitHub ja tem Docker
      # rodando, que e o que o Testcontainers usa para subir o PostgreSQL.
      - name: Tesseract (com portugues)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
          tesseract --version
          tesseract --list-langs

      - name: mvn verify
        run: mvn -B verify

      - name: Relatorios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
